<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>
    <center>
        <h1>Student Registration Form</h1>
    <section>
        <div>
            
                
            <form>
                
                <label>Student Name:</label>
                <input type="text" placeholder="Enter your name"><br/>
                <br>
                <label>Student Email:</label>
                <input type="email" placeholder="Enter your email"><br/>
                <br>
                <label>Password:</label>
                <input type="password" placeholder="Enter your password"><br/>
                <br>
                <label>Student Age:</label>
                <input type="number" placeholder="Enter your age"><br/>
                <br>
                <label>Date of Birth:</label>
                <input type="date""><br/>
                <br>
                <label>Gender:</label>
                <input type="radio" name="gender" value="male"><label>Male</label>
                <input type="radio" name="gender" value="female"><label>Female</label><br/>
                <br>
                <label>Courses:</label>
                <select>
                    <option >Python Fullstack</option>
                    <option>Java Fullstack</option>
                    <option>MernStack</option>
                    <option>DotNet Fullstack</option><br/>
                
                </select><br/>
                <br>
                <label>Student Skills:</label>
                <input type="checkbox" name="Skills" value="Python"><label>Python</label>
                <input type="checkbox" name="Skills" value="Java"><label>Java</label>
                <input type="checkbox" name="Skills" value="JavaScript"><label>JavaScript</label>
                <br/><br>
                <label>Student Address:</label>
                <textarea rows="1" cols="30" placeholder="Enter your address"></textarea><br/>
                <br>
                <button type="reset">Reset</button>
                <button type="submit">Submit</button>
            </form>
        </div>
    </section>
    </center>

    
</body>
</html>
