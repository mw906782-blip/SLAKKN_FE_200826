<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Page</title>
</head>
<body style="background-color: black; color: white;">
    <center>
<section>
    <div>
        <h1>Fill the form to order</h1>
        <form>
            <table cellspacing="15">
                <tr>
                    <td><label>Customer Name</label></td>
                   <td> <input type="text" placeholder="Enter your name"></td>
                </tr>
                <tr>
                    <td><label>Email</label></td>
                    <td><input type="email" placeholder="enter your email"></td>
                    </tr>
                    <tr>
                        <td><label>Phone</label></td>
                        <td><input type="number" placeholder="enter your phone number"></td>
                    </tr>
                    <tr>
                        <td><label>Select the laptop</label></td>
                        <td><select>
                            <option value="Maze XPS16">Maze XPS16</option>
                            <option value="Maze Yoga Pro 9i">Maze Yoga Pro 9i</option>
                            <option value="Maze Spectre x360 14">Maze Spectre x360 14</option>
                            <option value="Maze Inspiron 15">Maze Inspiron 15</option>
                            <option value="Maze IdeaPad Slim 3">Maze IdeaPad Slim 3</option>
                            <option value="Maze Aspire 5">Maze Aspire 5</option>
                            <option value="Maze 15">Maze 15</option>
                            <option value="Maze vivobook 15">Maze vivobook 15</option>
                        </select></td>
                    </tr>
                    <tr>
                        <td><label>Quantity</label></td>
                        <td><select>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select></td>
                    </tr>

                    <tr>
                        <td><label>Address</label></td>
                        <td><textarea rows="2" cols="20" placeholder="Enter your Address"></textarea></td>
                    </tr>
                    <tr>
                        <td><label>Payment method</label></td>
                        <td>
                           <select>
                            <option value="Net Banking">Net Banking</option>
                            <option value="UPI">UPI</option>
                            <option value="Cash on Delivery">COD</option>
                           </select>
                        </td>
                    </tr>
                    <tr>
                        <td><button>Reset</button></td>
                        <td><button><a href="Placed.html">Place order</a></button></td>
                    </tr>
            </table>
        </form>
    </div>
</section>

    </center>

    
</body>
</html>
